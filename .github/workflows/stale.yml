name: Close abandoned issues

# Marks issues nobody has touched in three months, and closes them a month after
# that if still nothing. The point is not tidiness: an issue list where half the
# entries are questions someone stopped caring about is a list nobody reads, and
# then the real reports get missed too.
#
# This is the only scheduled workflow here, and it is deliberate. Everything else
# runs on a push, a pull request or by hand, because a workflow that fires on a
# timer is one nobody is watching when it goes wrong. A stale sweep has nothing
# to hang off except time, so it gets the exception rather than the rule getting
# dropped. `workflow_dispatch` is here too, so the sweep can also be run and
# watched on purpose rather than only ever meeting it after the fact.
#
# It is being set up before there is anything to sweep. The tracker for this
# package is very close to empty, and that is the point: this is the only moment
# when three months and one month can be chosen for being reasonable, rather than
# reverse-engineered from a backlog that a shorter threshold would happen to
# clear. Thresholds picked against an existing pile are thresholds picked to
# reach a result. Nothing here is aimed at any issue that exists, because none
# of them do yet.
#
# It is set up so that being wrong is cheap:
#
#   * Three months of silence, then another month before anything closes. A
#     report from someone who is waiting on a reply is not abandoned.
#   * Anything labelled `bug`, `security` or `pinned` is never touched. A
#     confirmed defect does not stop existing because nobody commented on it.
#     `good first issue` and `help wanted` are exempt for the opposite reason:
#     they are invitations left open on purpose, and silence on one is the
#     normal state, not a sign it has been dropped.
#   * Pull requests are left alone entirely.
#   * A closed issue can be reopened by anyone with a comment, and the message
#     says so.

on:
  schedule:
    # Mondays at 06:00 UTC. Weekly is far more often than this repository needs;
    # it is the cheapest way to keep the batch small enough to look at.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  stale:
    name: Sweep issues nobody has touched
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: stale
          exempt-issue-labels: "bug,security,pinned,good first issue,help wanted"

          # Pull requests are out of scope. A pull request that has stalled is
          # already visible in a list short enough that nobody needs reminding
          # to read it, and the only automated ones this repository will receive
          # are Dependabot's, which dependabot-auto-merge.yml disposes of on its
          # own. That leaves this sweep nothing to catch but a pull request
          # somebody is still working on.
          days-before-pr-stale: -1
          days-before-pr-close: -1

          stale-issue-message: >
            No activity here for three months, so this is marked stale. If it is
            still relevant, a comment is enough to keep it open, and it will be
            closed in a month otherwise. Nothing labelled bug, security or pinned
            is ever marked this way, so if this is a defect that was never
            labelled as one, say so and it will be.

          close-issue-message: >
            Closed after four months without activity. This is housekeeping and
            not a judgement: comment and it reopens, and the history stays here
            either way.

          # The default. Small enough that a bad configuration cannot sweep the
          # whole tracker before anyone notices.
          operations-per-run: 30
