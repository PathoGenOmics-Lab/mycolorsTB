name: Dependency review

# Stops a pull request that would bring in a dependency with a known
# vulnerability, which is the half of the problem Dependabot does not cover.
# Dependabot tells you about a vulnerable dependency you already have; this
# refuses the one you are about to add, while refusing it is still free.
#
# Be honest about how far that reaches in this repository. GitHub's dependency
# graph does not parse an R DESCRIPTION file, so ggplot2, ape, ggtree and
# grDevices are invisible to it, and ggtree is a Bioconductor package that the
# advisory database would not have an entry for anyway. What the action can
# actually see here is what the workflows under .github/workflows pull in, which
# is the same surface Dependabot's github-actions ecosystem updates. That is a
# much smaller job than it does in a repository with a committed lockfile, and
# it is still the cheap half of the problem: an action runs with this
# repository's token, and catching a bad one at the pull request that adds it
# costs nothing.
#
# It compares the dependency graph of the base against the head, so it only ever
# has an opinion about what the pull request itself introduces. Everything
# already in the tree is somebody else's conversation, and Dependabot is the one
# having it.
#
# `moderate` rather than the default `low`: a low severity advisory on a
# transitive build dependency is worth reading and is not worth blocking a merge
# on, and a gate that blocks for things nobody acts on stops being read.

on:
  pull_request

permissions:
  contents: read
  # For the summary comment it leaves when it refuses one.
  pull-requests: write

jobs:
  review:
    name: No new dependency with a known vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # Only when it has something to say. A summary on every pull request
          # is a summary nobody reads by the third one.
          comment-summary-in-pr: on-failure
